[project]
name = "windows-use-mcp"
version = "1.0.0"
description = "MCP Server exposing the Windows-Use GUI agent to MCP clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["windows", "mcp", "model-context-protocol", "automation", "gui", "agent", "desktop"]
dependencies = [
    "mcp>=2.0.0",
    # windows-use 0.8.1 on PyPI cannot be imported: its mistral provider does
    # `from mistralai import Mistral`, and mistralai 2.x and 3.x are namespace
    # packages that no longer export that name at the top level. The fix is on
    # main (Jeomon/Windows-Use commit 144a053). Swap this for
    # "windows-use>=0.8.2" once a release containing the fix is published.
    "windows-use @ git+https://github.com/Jeomon/Windows-Use@main",
]

[project.scripts]
windows-use-mcp = "windows_use_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_use_mcp"]

[tool.hatch.metadata]
# windows-use is depended on as a direct git reference, see dependencies above.
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.12.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

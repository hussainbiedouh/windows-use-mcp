[project]
name = "windows-use-mcp"
version = "1.0.0"
description = "MCP Server exposing the Windows-Use GUI agent to MCP clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["windows", "mcp", "model-context-protocol", "automation", "gui", "agent", "desktop"]
dependencies = [
    "mcp>=2.0.0",
    "windows-use>=0.8.1",
]

[project.scripts]
windows-use-mcp = "windows_use_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_use_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.12.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]
